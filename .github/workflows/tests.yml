# Corre los tests automáticamente en cada push y pull request.
# El resultado aparece en la pestaña "Actions" del repositorio y como ✓ o ✗ junto a cada commit.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            Primera fase práctica/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Correr tests
        run: pytest
